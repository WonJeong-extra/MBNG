name: Discord Periodic Alarm

# 어비스 검은 구멍 출현 10분 전에 디스코드로 알린다.
# 기준 시각은 이 저장소의 hole.json을 읽는다. MBNG Advisor 상단 [변경]에서 토큰을 넣고 저장하면 이 파일이 바뀐다.
# - 예약 실행: 150분 안에 알릴 회차가 있으면 그때까지 기다렸다 보낸다. 기다리는 동안 5분마다 hole.json을 다시 읽는다.
#   cron은 30분마다로 적었지만 GitHub이 실제로는 약 1시간 간격(최대 108분, 2026-11-07~09 기록)으로 돌려서 대기 범위를 넉넉히 잡는다.
# - hole.json이 바뀌면(push): 바로 갱신 확인 메시지를 보낸다.
# - 점검 뒤에는 새 기준이 들어올 때까지 알리지 않는다. 점검 시각은 MBNG Advisor 데이터 API의 점검 일정
#   (api/v1/maintenance.json, 공식 공지사항에서 자동으로 옮김)을 앱과 같은 규칙으로 쓴다.
#   공지된 점검(정기·임시)과 공지 없는 목요일 06:00 중 이른 쪽이고, '정기점검 미진행' 공지가 있는 목요일은 건너뛴다.
#   일정을 못 읽으면 목요일 06:00만 쓴다(로그에 남김).

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - hole.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: discord-hole-${{ github.event_name == 'push' && 'notice' || 'alarm' }}
      cancel-in-progress: false
    steps:
      - name: Notify
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event_name == 'push' && 'notice' || 'alarm' }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          CYCLE = timedelta(hours=36, minutes=15)   # 15분 열림 + 36시간
          LEAD = timedelta(minutes=10)              # 출현 10분 전에 알림
          LOOK = timedelta(minutes=150)
          POLL = 300

          def utcnow():
              return datetime.now(timezone.utc)

          def done(msg=""):
              """건너뛰는 경우도 성공(종료 코드 0)으로 끝낸다. SystemExit에 문자열을 주면 실패로 표시된다"""
              if msg:
                  print(msg)
              raise SystemExit(0)

          def load_base():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/contents/hole.json",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github.raw+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "mbng-hole-alarm"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return datetime.fromisoformat(json.load(r)["base"])
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          MAINT_URL = "https://wonjeong-dev.github.io/MBNG-Advisor/api/v1/maintenance.json"

          def load_maint():
              """공지된 점검 시작 시각 목록과 미진행 날짜. 못 읽으면 None"""
              try:
                  req = urllib.request.Request(MAINT_URL, headers={"User-Agent": "mbng-hole-alarm"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      rows = json.load(r)["data"]["schedule"]
                  starts = sorted(datetime.fromisoformat(m["start_at"]) for m in rows
                                  if not m["canceled"] and m["start_at"])
                  skip = {m["date"] for m in rows if m["canceled"]}
                  return starts, skip
              except Exception as e:
                  print("점검 일정을 못 읽어 목요일 06:00만 씀:", e)
                  return None

          MAINT = load_maint()

          def thursday_after(t):
              """t 다음 목요일 06:00(KST)"""
              d = t.astimezone(KST)
              n = datetime(d.year, d.month, d.day, 6, tzinfo=KST) + timedelta(days=(3 - d.weekday()) % 7)
              return n if n > t else n + timedelta(days=7)

          def reset_after(t):
              """t 다음 점검 시작(앱 holeReset과 같은 규칙)"""
              n = thursday_after(t)
              if MAINT is None:
                  return n
              starts, skip = MAINT
              days = {s.astimezone(KST).date().isoformat() for s in starts}
              for _ in range(8):
                  day = n.astimezone(KST).date().isoformat()
                  if day not in skip and day not in days:
                      break
                  n += timedelta(days=7)
              for s in starts:
                  if t < s < n:
                      n = s
              return n

          def holes(base, after):
              """after 이후에 출현하는 회차, 다음 점검 전까지"""
              end = reset_after(base)
              k = max(0, -((base - after) // CYCLE))
              h = base + k * CYCLE
              while h < end:
                  yield h
                  h += CYCLE

          def post(content):
              url = os.environ.get("WEBHOOK_URL")
              if not url:
                  raise RuntimeError("Missing Discord webhook URL")
              req = urllib.request.Request(
                  url, data=json.dumps({"content": content}).encode("utf-8"),
                  headers={"Content-Type": "application/json",
                           "User-Agent": "DiscordBot (github-actions, 1.0)"},
                  method="POST")
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("Notification sent:", r.status)

          ts = lambda t: int(t.timestamp())
          base = load_base()
          if base is None:
              done("hole.json이 없어 건너뜀")

          if os.environ["MODE"] == "notice":
              L = list(holes(base, utcnow()))[:3]
              if L:
                  nxt = " · ".join(f"<t:{ts(h)}:f>" for h in L)
                  post(f"🐬 어비스 검은 구멍 시각 갱신 · 다음 출현 {nxt} (<t:{ts(L[0])}:R>) 🐬")
              else:
                  post(f"🐬 어비스 검은 구멍 기준이 갱신됐지만 다음 점검(<t:{ts(reset_after(base))}:f>) 전까지 남은 출현이 없어요 🐬")
              done()

          h = next(holes(base, utcnow() + LEAD), None)
          if h is None:
              done(f"기준 {base}: 점검 전 남은 회차 없음, 새 기준을 기다림")
          if h - LEAD - utcnow() > LOOK:
              done(f"다음 알림 {h - LEAD}, 아직 멀어서 건너뜀")

          while True:
              wait = (h - LEAD - utcnow()).total_seconds()
              if wait <= 0:
                  break
              print(f"{h - LEAD}까지 대기 ({int(wait)}초)")
              time.sleep(min(wait, POLL))
              nb = load_base()
              nm = load_maint() or MAINT   # 대기 중 임시점검이 공지되면 반영, 못 읽으면 전 값 유지
              if nb != base or nm != MAINT:
                  base, MAINT = nb, nm
                  h = None if base is None else next(holes(base, utcnow() + LEAD), None)
                  if h is None or h - LEAD - utcnow() > LOOK:
                      done("기준 또는 점검 일정이 바뀌어 이번 대기를 끝냄")
                  print(f"기준 또는 점검 일정이 바뀜: 다음 출현 {h}")

          post(f"🐬 <t:{ts(h)}:t> 어비스 검은 구멍 출현 (<t:{ts(h)}:R>) 🐬")
          PY
